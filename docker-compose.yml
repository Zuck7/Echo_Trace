services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: echotrace-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - echotrace-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: echotrace-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - echotrace-minio-data:/data

  fileservice:
    build:
      context: ./src/EchoTrace.FileService
    container_name: echotrace-fileservice
    depends_on:
      - minio
    environment:
      PORT: 3000
      INTERNAL_KEY: ${FILE_SERVICE_INTERNAL_KEY}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: echotrace-documents
    ports:
      - "3001:3000"
    restart: unless-stopped

  api:
    build:
      context: ./src/EchoTrace.API
      dockerfile: EchoTrace.API/Dockerfile
    container_name: echotrace-api
    depends_on:
      sqlserver:
        condition: service_healthy
      fileservice:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Server=sqlserver,1433;Database=EchoTraceDb;User Id=sa;Password=${SA_PASSWORD};Encrypt=False;TrustServerCertificate=True
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: echotrace-local
      Jwt__Audience: echotrace-local
      FileService__BaseUrl: http://fileservice:3000
      FileService__InternalKey: ${FILE_SERVICE_INTERNAL_KEY}
    ports:
      - "5150:8080"
    restart: unless-stopped

volumes:
  echotrace-sql-data:
  echotrace-minio-data:
